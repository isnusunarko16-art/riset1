<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic Research Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<style>
:root{--bg:#f4f5f7;--c:#fff;--t:#0f172a;--m:#64748b;--a:#2f4ac2;--ab:#eaeefc;--b:#e2e5ea;--er:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--c:#151b23;--t:#e6eaf0;--m:#8b97a8;--a:#8fa6ff;--ab:#1c2542;--b:#252d38;--er:#ff8a80}}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 Inter,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
header{background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
.in{max-width:860px;margin:0 auto;padding:12px 16px 0}.br b{font:600 18px Newsreader,Georgia,serif}.br span{display:block;font-size:12px;color:var(--m)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px}.tabs a{padding:9px 14px;color:var(--m);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
.tabs a.on{color:var(--a);border-color:var(--a)}
main{max-width:860px;margin:0 auto;padding:22px 16px 80px}
h2{font:600 26px Newsreader,Georgia,serif;margin:0 0 16px;letter-spacing:-.3px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:500;color:var(--m);margin-top:6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:5px 0 12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent)}
textarea.sm{min-height:90px}textarea.paper{min-height:380px;font:17px/1.8 Newsreader,Georgia,serif;padding:18px}
button{background:var(--t);color:var(--c);border:1px solid var(--t);padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;font-size:14px;margin:3px 6px 3px 0}
button.s{background:transparent;color:var(--t);border-color:var(--b)}button.p{background:var(--a);border-color:var(--a);color:#fff}
.m{color:var(--m);font-size:13px}.pre{white-space:pre-wrap;line-height:1.75}.err{color:var(--er)}
.hint{background:var(--ab);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:130px}
.ol{padding:8px 4px;border-bottom:1px solid var(--b);cursor:pointer;display:flex;justify-content:space-between}
.ol:last-child{border:0}.ok{color:var(--a);font-weight:600}
progress{width:100%;height:6px;accent-color:var(--a)}
</style></head><body><div id="app"></div>
<script>
const SK=[
['abstrak','Abstrak','Bagian Awal','Ringkasan 150–250 kata: latar, tujuan, metode, hasil, simpulan. Tulis paling akhir.'],
['kunci','Kata Kunci','Bagian Awal','3–5 kata kunci dipisah koma.'],
['latar','Latar Belakang','BAB I PENDAHULUAN','Fenomena, data awal, masalah, alasan penting diteliti, kesenjangan penelitian.'],
['rumusan','Rumusan Masalah','BAB I PENDAHULUAN','Pertanyaan penelitian, konsisten dengan judul.'],
['tujuan','Tujuan Penelitian','BAB I PENDAHULUAN','Satu tujuan untuk tiap rumusan masalah.'],
['manfaat','Manfaat Penelitian','BAB I PENDAHULUAN','Manfaat teoretis dan praktis.'],
['batasan','Batasan Masalah','BAB I PENDAHULUAN','Ruang lingkup objek, waktu, dan variabel.'],
['teori','Landasan Teori','BAB II TINJAUAN PUSTAKA','Teori dan konsep utama sesuai fokus/variabel, dengan sitasi.'],
['terdahulu','Penelitian Terdahulu','BAB II TINJAUAN PUSTAKA','Sintesis penelitian relevan: persamaan, perbedaan, hasil.'],
['kerangka','Kerangka Pemikiran','BAB II TINJAUAN PUSTAKA','Alur hubungan antar konsep/variabel.'],
['hipotesis','Hipotesis','BAB II TINJAUAN PUSTAKA','Kuantitatif: H1, H2 dst. dengan dasar teori. Kosongkan bila kualitatif.'],
['jenis','Jenis dan Pendekatan Penelitian','BAB III METODE PENELITIAN','Jenis penelitian dan alasannya.'],
['subjek','Populasi dan Sampel / Subjek Penelitian','BAB III METODE PENELITIAN','Populasi, teknik sampling, jumlah sampel / informan.'],
['data','Teknik Pengumpulan Data','BAB III METODE PENELITIAN','Kuesioner, wawancara, observasi, dokumentasi.'],
['variabel','Variabel dan Definisi Operasional','BAB III METODE PENELITIAN','Variabel, indikator, skala pengukuran.'],
['analisis','Teknik Analisis Data','BAB III METODE PENELITIAN','Uji dan alat analisis yang dipakai.'],
['umum','Gambaran Umum Objek Penelitian','BAB IV HASIL DAN PEMBAHASAN','Profil singkat objek penelitian.'],
['hasil','Hasil Penelitian','BAB IV HASIL DAN PEMBAHASAN','Butuh data asli Anda: tempel angka/temuan di kotak poin.',1],
['bahas','Pembahasan','BAB IV HASIL DAN PEMBAHASAN','Tafsirkan temuan, kaitkan dengan teori dan penelitian terdahulu.',1],
['simpulan','Kesimpulan','BAB V PENUTUP','Jawaban atas rumusan masalah, sesuai temuan.'],
['saran','Saran','BAB V PENUTUP','Saran praktis dan untuk penelitian berikutnya.']];
const AR=[
['abstrak','Abstrak','Artikel','150–250 kata. Tulis paling akhir.'],
['kunci','Kata Kunci','Artikel','3–5 kata kunci dipisah koma.'],
['pend','Pendahuluan','Artikel','Latar, kesenjangan penelitian, tujuan, kontribusi.'],
['tinjauan','Tinjauan Pustaka','Artikel','Teori dan penelitian terdahulu, dengan sitasi.'],
['metode','Metode','Artikel','Desain, data, sampel, teknik analisis.'],
['hasil','Hasil','Artikel','Butuh data asli Anda: tempel angka/temuan di kotak poin.',1],
['bahas','Pembahasan','Artikel','Tafsirkan temuan dan kaitkan dengan literatur.',1],
['simpulan','Kesimpulan','Artikel','Temuan utama, implikasi, keterbatasan, saran.'],
['terima','Ucapan Terima Kasih','Artikel','Opsional.']];
const secs=d=>d.type=='skripsi'?SK:AR;
let D={docs:[],set:{key:'',model:''},cur:null,tab:'docs'},MODELS=null,RS=[];
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cd=()=>D.docs.find(d=>d.id===D.cur),wc=t=>(t||'').trim().split(/\s+/).filter(Boolean).length;
const idb=()=>new Promise(r=>{const q=indexedDB.open('ars2',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
function load(){idb().then(d=>{const g=d.transaction('k').objectStore('k').get('d');g.onsuccess=()=>{if(g.result)D=Object.assign(D,g.result);if(!D.docs.length)D.tab='docs';draw()}})}
function save(){idb().then(d=>d.transaction('k','readwrite').objectStore('k').put(D,'d'))}
const dl=(n,t,m='text/plain')=>{const x=document.createElement('a');x.href=URL.createObjectURL(t instanceof Blob?t:new Blob([t],{type:m}));x.download=n;x.click()};
function go(t){D.tab=t;draw()}
function draw(){const tabs=[['docs','Dokumen'],['write','Susun'],['refs','Referensi'],['export','Ekspor'],['set','Setelan']];
$('#app').innerHTML=`<header><div class="in"><div class="br"><b>Academic Research Studio</b><span>Penyusun skripsi &amp; artikel ilmiah</span></div><div class="tabs">${tabs.map(t=>`<a class="${t[0]==D.tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</a>`).join('')}</div></div></header><main>${V[D.tab]()}</main>`}
const GB='https://generativelanguage.googleapis.com/v1beta/';
async function ai(p){if(!D.set.key)throw Error('API key Gemini belum diisi (tab Setelan).');
if(!MODELS){const r=await fetch(GB+'models?pageSize=200',{headers:{'x-goog-api-key':D.set.key}});const j=await r.json();if(!r.ok)throw Error('Key ditolak: '+(j.error?.message||r.status));
MODELS=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/flash/.test(m.name)&&!/image|tts|live|audio|robotics|computer/.test(m.name)).map(m=>m.name.replace('models/','')).sort().reverse()}
const ms=[D.set.model,...MODELS].filter((m,i,a)=>m&&a.indexOf(m)==i).slice(0,4);let err=Error('Tidak ada model flash yang tersedia untuk key ini.');
for(const m of ms)for(let t=0;t<2;t++){try{const r=await fetch(GB+'models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':D.set.key},body:JSON.stringify({contents:[{parts:[{text:p}]}]})});
const j=await r.json();if(!r.ok)throw Error(m+': '+(j.error?.message||r.status));return(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text).join('')}catch(x){err=x;await new Promise(z=>setTimeout(z,1200))}}
throw err}
const RULE='ATURAN WAJIB: tulis prosa akademik tanpa markdown, heading, atau poin. Jangan mengarang data, angka, hasil, responden, atau referensi. Sitasi hanya dalam format (Penulis, tahun) yang ada di daftar referensi; jika klaim butuh sumber tetapi tidak ada di daftar, tulis [PERLU REFERENSI]. Jaga konsistensi dengan judul dan bagian lain.';
function prompt(d,k,task){const L=secs(d);return`${RULE}\nBahasa: ${d.lang}.\nJenis: ${d.type}. Judul: ${d.title}. Bidang: ${d.field||'-'}. Pendekatan: ${d.method}.\n\nBagian lain yang sudah ada:\n${L.filter(x=>x[0]!=k&&d.sec[x[0]]).map(x=>x[1]+': '+d.sec[x[0]].slice(0,300)).join('\n')||'-'}\n\nReferensi tersedia:\n${d.refs.slice(0,20).map(r=>cite(r)+' '+r.title+(r.abs?' | '+r.abs.slice(0,300):'')).join('\n')||'(belum ada)'}\n\nTUGAS:\n${task}`}
const ini2=g=>(g||'').split(/[\s.]+/).filter(Boolean).map(x=>x[0].toUpperCase()+'.').join(' ');
function cite(r){const n=(r.authors||[]).map(x=>x.split(', ')[0]);const a=!n.length?r.title.split(' ')[0]:n.length==1?n[0]:n.length==2?n[0]+' & '+n[1]:n[0]+' et al.';return`(${a}, ${r.year||'t.t.'})`}
function auth(r){const a=(r.authors||[]).map(x=>{const[f,g]=x.split(', ');return g?f+', '+ini2(g):f});if(!a.length)return r.title.split(' ').slice(0,3).join(' ');return a.length==1?a[0]:a.slice(0,-1).join(', ')+', & '+a[a.length-1]}
function refParts(r){const j=r.journal?[[r.journal+(r.vol?', '+r.vol:'')+(r.pages?', '+r.pages:''),1],['. ',0]]:[];const l=r.doi?'https://doi.org/'+r.doi:(r.url||'');return[[`${auth(r)} (${r.year||'t.t.'}). ${r.title}. `,0],...j,[l,0]]}
const refTxt=r=>refParts(r).map(x=>x[0]).join('');
const empty=t=>`<div class="card"><p>${t}</p><button class="p" onclick="go('docs')">Ke Dokumen</button></div>`;
const V={
docs(){return`<h2>Dokumen</h2>${D.docs.map((d,i)=>{const L=secs(d),k=L.filter(x=>d.sec[x[0]]).length;return`<div class="card"><b>${e(d.title)}</b><div class="m">${d.type=='skripsi'?'Skripsi':'Artikel Jurnal'} • ${k}/${L.length} bagian • ${D.cur==d.id?'aktif':''}</div><progress value="${k}" max="${L.length}"></progress><div style="margin-top:8px"><button class="p" onclick="D.cur='${d.id}';save();go('write')">Buka</button><button class="s" onclick="if(confirm('Hapus dokumen ini?')){D.docs.splice(${i},1);if(D.cur=='${d.id}')D.cur=null;save();draw()}">Hapus</button></div></div>`}).join('')}
<div class="card"><b>Dokumen baru</b><label>Jenis</label><select id="ty"><option value="skripsi">Skripsi (BAB I–V)</option><option value="artikel">Artikel Jurnal</option></select>
<label>Judul</label><textarea id="ti" class="sm"></textarea><label>Bidang / program studi</label><input id="fi"><div class="row"><div><label>Pendekatan</label><select id="me"><option>Kuantitatif</option><option>Kualitatif</option><option>Campuran</option><option>Studi pustaka</option></select></div><div><label>Bahasa</label><select id="lg"><option>Indonesia</option><option>English</option></select></div></div>
<label>Nama penulis (untuk cover)</label><input id="au"><label>Institusi / program studi (untuk cover)</label><input id="in"><button class="p" onclick="mk()">Buat dokumen</button></div>`},
write(){const d=cd();if(!d)return empty('Buat atau pilih dokumen dulu.');const L=secs(d),k=d.sel&&L.find(x=>x[0]==d.sel)?d.sel:L[0][0];d.sel=k;const s=L.find(x=>x[0]==k),gs=[...new Set(L.map(x=>x[2]))],tot=L.reduce((a,x)=>a+wc(d.sec[x[0]]),0);
return`<h2>${e(d.title)}</h2><div class="m" style="margin:-8px 0 14px">${tot} kata • autosave aktif</div>
<div class="card"><label>Bagian</label><select onchange="cd().sel=this.value;save();draw()">${gs.map(g=>`<optgroup label="${g}">${L.filter(x=>x[2]==g).map(x=>`<option value="${x[0]}" ${x[0]==k?'selected':''}>${d.sec[x[0]]?'✓ ':''}${x[1]}</option>`).join('')}</optgroup>`).join('')}</select>
<div class="hint"><b>${s[1]}</b> — ${s[3]}</div>
<label>Poin, data, atau ide Anda untuk bagian ini (dasar tulisan AI)</label><textarea class="sm" oninput="cd().notes[cd().sel]=this.value;save()" placeholder="Contoh: fenomena, angka, hasil olah data, temuan wawancara…">${e(d.notes[k]||'')}</textarea>
<div class="row"><div><select id="ln"><option value="150">Pendek (±150 kata)</option><option value="300" selected>Sedang (±300 kata)</option><option value="600">Panjang (±600 kata)</option></select></div><div><button class="p" style="width:100%" onclick="act('tulis')">Tulis dengan AI</button></div></div></div>
<div class="card"><textarea id="tx" class="paper" oninput="cd().sec[cd().sel]=this.value;save()" placeholder="Tulis di sini atau gunakan AI…">${e(d.sec[k]||'')}</textarea>
<div class="row"><button class="s" onclick="act('revisi')">Revisi</button><button class="s" onclick="act('panjang')">Kembangkan</button><button class="s" onclick="act('para')">Parafrase</button>${d.prev&&d.prev[k]!==undefined?'<button class="s" onclick="undo()">Urungkan</button>':''}</div>
<div class="row" style="margin-top:6px">${d.refs.length?`<select id="cs">${d.refs.map((r,i)=>`<option value="${i}">${e(cite(r))} ${e(r.title.slice(0,40))}</option>`).join('')}</select><button class="s" onclick="ic()">Sisipkan sitasi</button>`:'<span class="m">Tambah referensi di tab Referensi untuk menyisipkan sitasi.</span>'}</div>
<div class="row" style="margin-top:6px"><button class="s" onclick="nav(-1)">← Sebelumnya</button><button class="s" onclick="nav(1)">Berikutnya →</button></div></div>
<div id="res"></div>
<div class="card"><b>Daftar isi &amp; progres</b><div id="dp" class="m"></div>${L.map(x=>`<div class="ol" onclick="cd().sel='${x[0]}';save();draw();scrollTo(0,0)"><span class="${d.sec[x[0]]?'ok':''}">${d.sec[x[0]]?'✓':'○'} ${x[1]}</span><span class="m">${wc(d.sec[x[0]])||''}</span></div>`).join('')}<button class="p" style="margin-top:10px" onclick="draftAll()">Draft semua bagian kosong (AI)</button><div class="m">Hasil dan Pembahasan hanya ditulis jika Anda mengisi poin/data-nya.</div></div>`},
refs(){const d=cd();if(!d)return empty('Buat atau pilih dokumen dulu.');return`<h2>Referensi</h2>
<div class="card"><b>Cari literatur (OpenAlex)</b><input id="q" placeholder="Kata kunci atau judul"><button class="p" onclick="srch()">Cari</button><div id="rs"></div></div>
<div class="card"><b>Impor DOI</b><input id="doi" placeholder="10.xxxx/xxxxx"><button onclick="impDoi()">Impor</button></div>
<div class="card"><b>Tambah manual (buku, laporan, dll.)</b><label>Penulis (satu per baris: Belakang, Depan)</label><textarea id="ma" class="sm"></textarea><div class="row"><input id="my" placeholder="Tahun"><input id="mj" placeholder="Jurnal / penerbit"></div><input id="mt" placeholder="Judul"><input id="ml" placeholder="DOI atau URL (opsional)"><button onclick="addMan()">Simpan</button></div>
<div class="card"><b>Daftar pustaka (APA 7) — ${d.refs.length}</b>${d.refs.slice().sort((a,b)=>refTxt(a).localeCompare(refTxt(b))).map(r=>`<div class="ol"><span>${e(refTxt(r))}</span><button class="s" onclick="delRef(${d.refs.indexOf(r)})">Hapus</button></div>`).join('')||'<p class="m">Belum ada referensi.</p>'}</div>`},
export(){const d=cd();if(!d)return empty('Buat atau pilih dokumen dulu.');const L=secs(d),miss=L.filter(x=>!d.sec[x[0]]&&x[0]!='terima'&&x[0]!='hipotesis').map(x=>x[1]);
return`<h2>Ekspor</h2><div class="card"><b>${e(d.title)}</b><div class="m">Total ${L.reduce((a,x)=>a+wc(d.sec[x[0]]),0)} kata • ${d.refs.length} referensi</div>${miss.length?`<p class="m">Bagian masih kosong: ${e(miss.join(', '))}</p>`:''}
<button class="p" onclick="expD()">Unduh DOCX</button><button class="s" onclick="copyAll()">Salin seluruh teks</button><button class="s" onclick="dl('backup.json',JSON.stringify(D),'application/json')">Backup JSON</button><button class="s" onclick="$('#bf').click()">Impor backup</button><input id="bf" type="file" hidden onchange="bi(this.files[0])"><div id="ex" class="m"></div>
<p class="m">DOCX memakai A4, Times New Roman 12, ${d.type=='skripsi'?'spasi 1,5, margin 4-3-3-3 cm':'margin 2,54 cm'}. Sesuaikan dengan pedoman kampus/jurnal Anda sebelum dikirim.</p></div>`},
set(){return`<h2>Setelan</h2><div class="card"><label>API key Gemini (tersimpan hanya di browser ini)</label><input type="password" value="${e(D.set.key)}" onchange="D.set.key=this.value.trim();MODELS=null;save()"><label>Model (kosongkan agar dipilih otomatis)</label><input value="${e(D.set.model)}" onchange="D.set.model=this.value.trim();save()">
<button class="p" onclick="$('#st').textContent='Menguji…';ai('Balas hanya: OK').then(t=>$('#st').textContent='Terhubung: '+t).catch(x=>$('#st').textContent='Gagal: '+x.message)">Tes koneksi</button><div id="st" class="m"></div><p class="m">Tanpa API key, penulisan manual, referensi, dan ekspor tetap berfungsi. Ambil key gratis di aistudio.google.com/apikey.</p></div>`}};
function mk(){const f=i=>$('#'+i).value.trim();if(!f('ti'))return alert('Isi judul dulu.');const d={id:'d'+Date.now(),type:f('ty'),title:f('ti'),field:f('fi'),method:f('me'),lang:f('lg'),author:f('au'),inst:f('in'),sec:{},notes:{},refs:[],sel:null};D.docs.push(d);D.cur=d.id;save();go('write')}
function nav(n){const d=cd(),L=secs(d),i=L.findIndex(x=>x[0]==d.sel)+n;if(i<0||i>=L.length)return;d.sel=L[i][0];save();draw();scrollTo(0,0)}
function ic(){const d=cd(),ta=$('#tx'),c=cite(d.refs[$('#cs').value]),p=ta.selectionStart??ta.value.length;ta.value=ta.value.slice(0,p)+c+ta.value.slice(p);d.sec[d.sel]=ta.value;save()}
async function act(kind){const d=cd(),k=d.sel,s=secs(d).find(x=>x[0]==k),tx=d.sec[k]||'',nt=d.notes[k]||'',ln=$('#ln').value;
if(kind!='tulis'&&!tx.trim())return alert('Bagian ini masih kosong.');$('#res').innerHTML='<p class="m">AI bekerja…</p>';
const task={tulis:`Tulis bagian "${s[1]}" (${s[3]}) sekitar ${ln} kata. Dasar tulisan dari pengguna:\n${nt||'(kosong — susun dari konteks; untuk data/angka/fakta yang tidak diketahui tulis penanda [ISI: ...])'}`,revisi:`Revisi teks berikut: perbaiki tata bahasa, kohesi, argumen, dan kosakata akademik; pertahankan makna, data, dan sitasi.\n\n${tx}`,panjang:`Kembangkan teks berikut menjadi lebih mendalam (sekitar ${ln} kata) tanpa menambah data/fakta baru yang tidak ada:\n\n${tx}`,para:`Parafrase teks berikut dengan bahasa akademik; makna dan sitasi tetap:\n\n${tx}`}[kind];
try{const o=await ai(prompt(d,k,task));window.AO=o.trim();$('#res').innerHTML=`<div class="card"><b>Hasil AI</b><div class="pre" style="margin:10px 0">${e(o)}</div><button class="p" onclick="useAI(0)">Ganti isi bagian</button><button class="s" onclick="useAI(1)">Tambahkan di bawah</button><button class="s" onclick="$('#res').innerHTML=''">Buang</button></div>`}catch(x){$('#res').innerHTML='<div class="card err">'+e(x.message)+'</div>'}}
function useAI(add){const d=cd(),k=d.sel;(d.prev=d.prev||{})[k]=d.sec[k]||'';d.sec[k]=add?((d.sec[k]||'')+'\n\n'+AO).trim():AO;save();draw()}
function undo(){const d=cd(),k=d.sel;d.sec[k]=d.prev[k];delete d.prev[k];save();draw()}
async function draftAll(){const d=cd(),end=k=>k=='abstrak'||k=='kunci';const todo=secs(d).filter(x=>!d.sec[x[0]]&&(!x[4]||d.notes[x[0]])).sort((a,b)=>end(a[0])-end(b[0]));
if(!todo.length)return alert('Tidak ada bagian kosong yang bisa dibuat otomatis. Hasil dan Pembahasan butuh data dari Anda.');if(!confirm('AI akan menulis '+todo.length+' bagian. Lanjut?'))return;
for(const[i,x]of todo.entries()){$('#dp').textContent='Menulis '+(i+1)+'/'+todo.length+': '+x[1]+'…';try{d.sec[x[0]]=(await ai(prompt(d,x[0],`Tulis bagian "${x[1]}" (${x[3]}) sekitar 300 kata. Dasar: ${d.notes[x[0]]||'(susun dari konteks; data yang tidak diketahui ditandai [ISI: ...])'}`))).trim();save()}catch(er){$('#dp').textContent='Berhenti: '+er.message;return}}draw()}
const abs=i=>i?Object.entries(i).flatMap(([w,ps])=>ps.map(p=>[p,w])).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' '):'';
async function srch(){$('#rs').innerHTML='<p class="m">Mencari…</p>';try{const r=await fetch('https://api.openalex.org/works?per-page=10&search='+encodeURIComponent($('#q').value));if(!r.ok)throw Error('OpenAlex '+r.status);
RS=(await r.json()).results.map(w=>({title:w.title,authors:(w.authorships||[]).map(a=>{const n=a.author.display_name.split(' ');return n.pop()+', '+n.join(' ')}),year:w.publication_year,journal:w.primary_location?.source?.display_name||'',doi:(w.doi||'').replace('https://doi.org/',''),abs:abs(w.abstract_inverted_index)}));
$('#rs').innerHTML=RS.map((r,i)=>`<div class="ol"><span>${e(r.title)}<br><span class="m">${e(cite(r))} ${e(r.journal)}</span></span><button class="s" onclick="addRef(${i})">Tambah</button></div>`).join('')||'Tidak ada hasil.'}catch(x){$('#rs').textContent=x.message}}
function addRef(i){const d=cd(),r=RS[i];if(d.refs.some(x=>(r.doi&&x.doi==r.doi)||x.title==r.title))return alert('Sudah ada.');d.refs.push(r);save();draw()}
async function impDoi(){const d=cd();try{const r=await fetch('https://api.crossref.org/works/'+encodeURIComponent($('#doi').value.trim().replace(/^https?:\/\/doi.org\//,'')));if(!r.ok)throw Error('DOI tidak ditemukan ('+r.status+')');const m=(await r.json()).message;
d.refs.push({title:(m.title||[''])[0],authors:(m.author||[]).map(a=>a.family+', '+(a.given||'')),year:m.issued?.['date-parts']?.[0]?.[0],journal:(m['container-title']||[''])[0],doi:m.DOI,vol:m.volume,pages:m.page,abs:(m.abstract||'').replace(/<[^>]+>/g,'')});save();draw()}catch(x){alert(x.message)}}
function addMan(){const d=cd(),f=i=>$('#'+i).value.trim();if(!f('mt'))return alert('Isi judul.');const l=f('ml');d.refs.push({title:f('mt'),authors:f('ma').split('\n').map(s=>s.trim()).filter(Boolean),year:f('my'),journal:f('mj'),doi:/^10\./.test(l)?l:'',url:/^10\./.test(l)?'':l});save();draw()}
function delRef(i){cd().refs.splice(i,1);save();draw()}
function body(d){const L=secs(d),o=[];let bn=0,sn=0,lg='';for(const x of L){const t=(d.sec[x[0]]||'').trim();if(!t)continue;
if(x[0]=='abstrak'){o.push({h:'Abstrak',c:1,t,ab:1});continue}if(x[0]=='kunci'){o.push({k:t});continue}
if(d.type=='skripsi'&&x[2]!=lg){bn++;sn=0;lg=x[2];o.push({g:x[2]})}sn++;o.push({h:d.type=='skripsi'?bn+'.'+sn+' '+x[1]:sn+'. '+x[1],t})}return o}
async function expD(){const d=cd(),{Document,Packer,Paragraph,TextRun,AlignmentType:A,PageNumber,Footer}=docx,sk=d.type=='skripsi',F='Times New Roman',LS=sk?360:276;
const T=(t,o={})=>new TextRun({text:t,font:F,size:o.sz||24,bold:o.b,italics:o.i});
const P=(r,o={})=>new Paragraph({children:r,alignment:o.al||A.JUSTIFIED,spacing:{line:o.line||LS,after:o.after??120},indent:o.ind,keepNext:o.kn,pageBreakBefore:o.pb});
let ch=[];const Cn=A.CENTER,Lf=A.LEFT;
if(sk)ch.push(P([T('SKRIPSI',{b:1})],{al:Cn,after:600}),P([T(d.title.toUpperCase(),{b:1})],{al:Cn,after:600}),P([T('Oleh:')],{al:Cn}),P([T(d.author||'[Nama Mahasiswa]',{b:1})],{al:Cn,after:600}),P([T(d.inst||'[Program Studi / Institusi]',{b:1})],{al:Cn}),P([T(String(new Date().getFullYear()))],{al:Cn}));
else ch.push(P([T(d.title,{b:1,sz:28})],{al:Cn,after:200}),P([T(d.author||'[Nama Penulis]')],{al:Cn}),P([T(d.inst||'[Afiliasi]',{i:1})],{al:Cn,after:300}));
for(const b of body(d)){if(b.g)ch.push(P([T(b.g,{b:1})],{al:Cn,pb:1}));else if(b.k)ch.push(P([T('Kata kunci: ',{b:1}),T(b.k,{i:1})],{al:Lf}));
else{ch.push(P([T(sk&&b.ab?'ABSTRAK':b.h,{b:1})],{al:b.c?Cn:Lf,pb:sk&&b.ab,kn:1}));b.t.split(/\n+/).filter(Boolean).forEach(p=>ch.push(P([T(p)],{ind:b.ab?undefined:{firstLine:720}})))}}
if(d.refs.length){ch.push(P([T('DAFTAR PUSTAKA',{b:1})],{al:Cn,pb:sk,kn:1}));d.refs.slice().sort((a,b)=>refTxt(a).localeCompare(refTxt(b))).forEach(r=>ch.push(P(refParts(r).map(x=>T(x[0],{i:x[1]})),{al:Lf,line:240,after:160,ind:{left:720,hanging:720}})))}
const doc=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:sk?{top:1701,bottom:1701,left:2268,right:1701}:{top:1440,bottom:1440,left:1440,right:1440}}},footers:{default:new Footer({children:[new Paragraph({alignment:Cn,children:[new TextRun({children:[PageNumber.CURRENT],font:F,size:24})]})]})},children:ch}]});
try{dl((d.title.slice(0,40).replace(/[^\w\s-]/g,'')||'dokumen')+'.docx',await Packer.toBlob(doc));$('#ex').textContent='DOCX dibuat.'}catch(x){$('#ex').textContent='Gagal: '+x.message}}
function copyAll(){const d=cd(),r=[d.title];for(const b of body(d)){if(b.g)r.push('\n'+b.g);else if(b.k)r.push('Kata kunci: '+b.k);else r.push('\n'+b.h+'\n'+b.t)}if(d.refs.length)r.push('\nDAFTAR PUSTAKA\n'+d.refs.map(refTxt).sort().join('\n'));
navigator.clipboard.writeText(r.join('\n')).then(()=>$('#ex').textContent='Tersalin.').catch(()=>$('#ex').textContent='Gagal menyalin.')}
function bi(f){f.text().then(t=>{D=Object.assign(D,JSON.parse(t));save();draw()})}
load();
</script></body></html>
